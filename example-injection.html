<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VBKD Gallery - Injection Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
    }

    .site-header {
      background-color: #243b42;
      color: white;
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .site-header h1 {
      margin-bottom: 0.5rem;
    }

    .site-header p {
      opacity: 0.9;
    }

    .gallery-wrapper {
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      margin: 0 2rem 2rem 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .site-footer {
      background-color: #243b42;
      color: white;
      padding: 2rem;
      text-align: center;
      margin-top: 2rem;
    }
  </style>
  
  <!-- Load React and ReactDOM from CDN (UMD format) -->
  <script src="https://cdn.jsdelivr.net/npm/react@19/dist/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@19/dist/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div class="site-header">
    <h1>Example Website with Injected VBKD Gallery</h1>
    <p>The gallery below is injected from a separate bundle loaded from localhost</p>
  </div>

  <!-- This is where the gallery will be injected -->
  <div class="gallery-wrapper">
    <div id="vbkd-gallery-root"></div>
  </div>

  <div class="site-footer">
    <p>&copy; 2025 Example Site. VBKD Gallery is embedded.</p>
  </div>

  <!-- Load the VBKD Gallery bundle (from Vite dev server) -->
  <!-- Vite automatically handles the compilation and HMR -->
  <link rel="stylesheet" href="http://localhost:5173/src/index.css" />
  <link rel="stylesheet" href="http://localhost:5173/src/App.css" />
  <script type="module">
    import { initVBKDGallery } from 'http://localhost:5173/src/main.tsx';
    window.VBKDGallery = { initVBKDGallery };
  </script>

  <script>
    // Once the page is loaded, initialize the gallery
    document.addEventListener('DOMContentLoaded', function() {
      // Small delay to ensure module import is complete
      setTimeout(() => {
        if (window.VBKDGallery && window.VBKDGallery.initVBKDGallery) {
          window.VBKDGallery.initVBKDGallery('vbkd-gallery-root');
          console.log('VBKD Gallery initialized successfully');
        } else {
          console.error('VBKD Gallery bundle not loaded correctly');
        }
      }, 100);
    });
  </script>
</body>
</html>
