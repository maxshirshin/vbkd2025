<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VBKD Gallery - Production Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
    }

    .site-header {
      background-color: #243b42;
      color: white;
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .site-header h1 {
      margin-bottom: 0.5rem;
    }

    .site-header p {
      opacity: 0.9;
    }

    .gallery-wrapper {
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      margin: 0 2rem 2rem 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .site-footer {
      background-color: #243b42;
      color: white;
      padding: 2rem;
      text-align: center;
      margin-top: 2rem;
    }
  </style>
  
    <!-- Load React and ReactDOM from CDN (UMD format).
         IMPORTANT: These must match the versions installed in `node_modules` when you
         built `./dist`. The installed versions in this workspace are logged below.
         If you see an error about React internals ("__CLIENT_INTERNALS...") then the
         runtime React version on the host does not match the one used to build the bundle.
         Update these URLs to the exact versions from your lockfile or run `npm install` with a fixed version.
    -->
      <!-- React and ReactDOM are bundled into the UMD build. No CDN scripts required. -->
      <!-- If you prefer to provide React from the host, revert the build changes in `vite.config.ts` and load the matching UMD CDN scripts here. -->
</head>
<body>
  <div class="site-header">
    <h1>VBKD Gallery - Production Example</h1>
    <p>Gallery injected from locally built production files</p>
  </div>

  <!-- This is where the gallery will be injected -->
  <div class="gallery-wrapper">
    <div id="vbkd-gallery-root"></div>
  </div>

  <div class="site-footer">
    <p>&copy; 2025. VBKD Gallery is embedded.</p>
  </div>

  <!-- Load the VBKD Gallery bundle from locally built dist folder -->
  <!-- LOCAL DEV: Loads from ./dist (built with npm run build) -->
  <!-- PRODUCTION: Replace ./dist/ with https://maxshirshin.github.io/vbkd2025/dist/ -->
  <link rel="stylesheet" href="./dist/vbkd2025.css" />
  <script src="./dist/vbkd-gallery.umd.js"></script>

  <script>
    // Once the page is loaded, initialize the gallery
    document.addEventListener('DOMContentLoaded', function() {
      if (window.VBKDGallery && window.VBKDGallery.initVBKDGallery) {
        window.VBKDGallery.initVBKDGallery('vbkd-gallery-root');
        console.log('VBKD Gallery initialized successfully');
      } else {
        console.error('VBKD Gallery bundle not loaded correctly');
      }
    });
  </script>
</body>
</html>
